[general]
static=yes
writeprotect=no
autofallthrough=yes
clearglobalvars=no
priorityjumping=no
VOIPMAX=10

[default]
include => incomming

exten => #,1,Playback(invalid)
exten => #,2,Hangup()

exten => h,1,DeadAGI(update.agi,${CALLERID(name)},${ANSWEREDTIME},${number},${UNIQUEID},${DIALSTATUS},${CDR(billsec)})

exten => i,1,Playback(invalid)
exten => t,1,Goto(#,1)
exten => s,2,hangup()

exten => _099X.,1,Dial(sip/91${EXTEN:3}@jimmytest,20,o)
exten => _099X.,2,Congestion()

[test-delay]
exten => 9999,1,NoOp(=== DELAY TEST START ===)
 same => n,Set(JIMMY=${RAND(3,5)})
 same => n,NoOp(Selected delay: ${JIMMY} seconds)
 same => n,Ringing()
 same => n,Wait(${JIMMY})
 same => n,Answer()
 same => n,NoOp(=== ANSWERED ===)
 same => n,Wait(10)
 same => n,Hangup()

[trunkinbound]

;exten => _0011111X.,1,Playback(demo-congrats)
;exten => _0011111X.,2,hangup()

;exten => _666000X.,1,Playback(demo-congrats)
;exten => _666000X.,2,hangup()


[from-sip]
exten => _X.,1,Congestion()

[incomming-guard]
; === Global Inbound Fraud Guard Gate ===
exten => _[0-9#+a-zA-Z].,1,NoOp(=== Inbound Security Gate: Checking ${EXTEN} ===)
 same => n,AGI(fraud_guard.py)
 same => n,GotoIf($["${FRAUD_STATUS}" = "BLOCKED"]?blocked)
 same => n,Goto(incomming,${EXTEN},1)
 same => n(blocked),NoOp(=== [FRAUD BLOCKED] Call to ${EXTEN} rejected with Cause 21 ===)
 same => n,Hangup(21)

exten => _X.,1,NoOp(=== Inbound Security Gate: Checking ${EXTEN} ===)
 same => n,AGI(fraud_guard.py)
 same => n,GotoIf($["${FRAUD_STATUS}" = "BLOCKED"]?blocked)
 same => n,Goto(incomming,${EXTEN},1)
 same => n(blocked),NoOp(=== [FRAUD BLOCKED] Call to ${EXTEN} rejected with Cause 21 ===)
 same => n,Hangup(21)

exten => i,1,Hangup(21)
exten => h,1,Hangup()

[ivr-language-router]
exten => s,1,NoOp(=== IVR Language Menu Started ===)
 same => n,AGI(secure_ivr_gate)
 same => n,GotoIf($["${SECURE_GATE_AUTH}" != "VERIFIED"]?auth_failed)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(TIMEOUT(digit)=3)
 same => n,Set(TIMEOUT(response)=5)
 same => n,Set(RETRIES=0)
 same => n(menu),NoOp(Playing Multi-Language Prompt: 1=EN, 2=HI, 3=ZH)
 same => n,Background(ivr_lang_choice)
 same => n,WaitExten(5)
 same => n(auth_failed),NoOp(=== UNAUTHORIZED HOST - REJECTING CALL ===)
 same => n,Hangup(21)

; Option 1: English Selected
exten => 1,1,NoOp(=== Caller Pressed 1: Selected English ===)
 same => n,Goto(incomming,71711#${CLEAN_DEST},1)

; Option 2: Hindi Selected
exten => 2,1,NoOp(=== Caller Pressed 2: Selected Hindi ===)
 same => n,Goto(incomming,71712#${CLEAN_DEST},1)

; Option 3: Chinese Selected
exten => 3,1,NoOp(=== Caller Pressed 3: Selected Chinese ===)
 same => n,Goto(incomming,71713#${CLEAN_DEST},1)

; Invalid Input Handler
exten => i,1,NoOp(=== Invalid Selection Pressed ===)
 same => n,Set(RETRIES=$[${RETRIES} + 1])
 same => n,GotoIf($[${RETRIES} >= 2]?max_fail)
 same => n,Goto(s,menu)
 same => n(max_fail),Hangup(16)

; Timeout Handler
exten => t,1,NoOp(=== Menu Response Timeout ===)
 same => n,Set(RETRIES=$[${RETRIES} + 1])
 same => n,GotoIf($[${RETRIES} >= 2]?max_fail)
 same => n,Goto(s,menu)
 same => n(max_fail),Hangup(16)

[incomming]
; --- 7171# Multi-Language IVR Robo Gateway ---
exten => _7171#.,1,NoOp(=== Inbound IVR Language Router: ${EXTEN} ===)
 same => n,Set(CLEAN_DEST=${EXTEN:5})
 same => n,Goto(ivr-language-router,s,1)

exten => _7171.,1,NoOp(=== Inbound IVR Language Router: ${EXTEN} ===)
 same => n,Set(CLEAN_DEST=${EXTEN:4})
 same => n,Goto(ivr-language-router,s,1)

; --- Redirected Destination Routes for English, Hindi & Chinese ---
; 1. English Service Route (71711#)
exten => _71711#.,1,NoOp(=== [ENGLISH SERVICE] Dialed for: ${EXTEN:6} ===)
 same => n,Playback(ivr_resp_english)
 same => n,Wait(1)
 same => n,Playback(15silence)
 same => n,Hangup()

; 2. Hindi Service Route (71712#)
exten => _71712#.,1,NoOp(=== [HINDI SERVICE] Dialed for: ${EXTEN:6} ===)
 same => n,Playback(ivr_resp_hindi)
 same => n,Wait(1)
 same => n,Playback(15silence)
 same => n,Hangup()

; 3. Chinese Service Route (71713#)
exten => _71713#.,1,NoOp(=== [CHINESE SERVICE] Dialed for: ${EXTEN:6} ===)
 same => n,Playback(ivr_resp_chinese)
 same => n,Wait(1)
 same => n,Playback(15silence)
 same => n,Hangup()

exten => i,1,NoOp(=== Invalid/Unconfigured Route: ${EXTEN} ===)
 same => n,Hangup(21)
exten => t,1,Hangup(21)

; --- Transit / Hairpin Route back to 54.39.157.14 with Masked SDP Audio IP ---
